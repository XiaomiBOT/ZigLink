<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - ZigLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --text: #ffffff; --primary: #ff5500; --border: #27272a; --muted: #a1a1aa; }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .container { padding: 20px; }
        h1 { font-size: clamp(80px, 15vw, 150px); margin: 0; font-weight: 800; color: var(--primary); line-height: 1; letter-spacing: -5px; }
        h2 { font-size: clamp(24px, 5vw, 32px); margin: 10px 0 20px 0; }
        p { color: var(--muted); margin-bottom: 40px; font-size: 16px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 12px 24px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); }
        .lucide { width: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Link Not Found</h2>
        <p>The link you are looking for might have been removed, expired, or never existed.</p>
        <a href="/" class="btn"><i data-lucide="home"></i> Back to Home</a>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
