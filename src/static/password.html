<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked Link - ZigLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --card: #18181b; --text: #ffffff; --primary: #ff5500; --border: #27272a; }
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 10px 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        p { color: #a1a1aa; margin-bottom: 20px; font-size: 14px; }
        input { width: 100%; background: #27272a; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; font-size: 16px; margin-bottom: 15px; transition: 0.2s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; background: var(--primary); border: none; padding: 12px; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Protected Link</h2>
        <p>This link is password protected.</p>
        <form method="GET">
            <input type="password" name="pwd" placeholder="Enter Password" required autofocus>
            <button type="submit">Unlock Link</button>
        </form>
    </div>
</body>
</html>
