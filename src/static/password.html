<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked Link - ZigLink</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #09090b; 
            --surface: #18181b; 
            --border: #27272a;
            --primary: #ff5500; 
            --primary-dark: #cc4400;
            --text: #ffffff; 
            --text-muted: #a1a1aa;
            --input-bg: #27272a; 
            --shadow: rgba(0,0,0,0.3);
            --font-main: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            font-family: var(--font-main); 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        .brand { 
            font-weight: 800; font-size: 24px; 
            display: flex; align-items: center; gap: 8px; 
            color: var(--text); text-decoration: none;
            margin-bottom: 30px;
        }
        .brand .lucide { color: var(--primary); width: 28px; height: 28px; animation: pulse 2s infinite; }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 40px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            box-shadow: 0 20px 60px var(--shadow);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .icon-circle {
            width: 60px; height: 60px;
            background: rgba(255, 85, 0, 0.1);
            border: 1px solid rgba(255, 85, 0, 0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px auto;
            color: var(--primary);
        }
        .icon-circle .lucide { width: 24px; height: 24px; }

        h2 { margin: 0 0 10px 0; font-weight: 700; font-size: 24px; }
        p { color: var(--text-muted); margin-bottom: 30px; font-size: 15px; line-height: 1.5; }

        .input-group { 
            position: relative; 
            background: var(--input-bg); 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            display: flex; align-items: center; 
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .input-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.1); }
        .input-group .lucide { margin-left: 15px; color: var(--text-muted); width: 20px; }
        
        input { 
            width: 100%; background: transparent; border: none; 
            color: var(--text); font-size: 16px; padding: 15px; 
            font-family: inherit; 
        }
        input::placeholder { color: var(--text-muted); opacity: 0.5; }

        button { 
            width: 100%; 
            background: var(--primary); 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            color: white; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 16px; 
            transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 85, 0, 0.25); }
        button:active { transform: translateY(0); }

        .copyright {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0.6;
        }

        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="brand">
        <i data-lucide="zap"></i> Zig<span>Link</span>
    </div>

    <div class="card">
        <div class="icon-circle">
            <i data-lucide="lock"></i>
        </div>
        <h2>Access Restricted</h2>
        <p>This short link is password protected.<br>Please enter the credential to continue.</p>
        
        <form method="GET">
            <div class="input-group">
                <i data-lucide="key"></i>
                <input type="password" name="pwd" placeholder="Enter Password..." required autofocus>
            </div>
            <button type="submit">Unlock Link <i data-lucide="arrow-right" style="width:18px;"></i></button>
        </form>
    </div>

    <div class="copyright">
        &copy; <span id="year"></span> ZigLink Secure Gateway
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('year').innerText = new Date().getFullYear();
        
        // Auto-shake if url has params (implies retry) but no success
        if(window.location.search.includes("pwd=")) {
            const card = document.querySelector('.card');
            card.style.animation = 'none';
            card.offsetHeight; /* trigger reflow */
            card.style.animation = 'shake 0.4s ease-in-out';
            const p = document.querySelector('p');
            p.innerText = "Incorrect password. Please try again.";
            p.style.color = "#ef4444";
        }
    </script>
    
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
