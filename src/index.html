<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZigLink - Advanced Shortener</title>
    <meta name="description" content="Secure, fast, and feature-rich URL shortener.">
    <link rel="canonical" href="https://ziglink.top">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #09090b; --surface: #18181b; --border: #27272a;
            --primary: #ff5500; --primary-dark: #cc4400;
            --text: #ffffff; --text-muted: #a1a1aa;
            --input-bg: #27272a; --shadow: rgba(0,0,0,0.3);
            --font-main: 'Outfit', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }
        [data-theme="light"] {
            --bg: #ffffff; --surface: #f4f4f5; --border: #e4e4e7;
            --primary: #ff5500; --primary-dark: #e04b00;
            --text: #18181b; --text-muted: #71717a;
            --input-bg: #e4e4e7; --shadow: rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin:0; font-family: var(--font-main); background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; transition: 0.3s; }
        
        header { display: flex; justify-content: space-between; padding: 20px clamp(20px, 5vw, 60px); border-bottom: 1px solid var(--border); background: var(--bg); }
        .brand { font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
        .brand .lucide { color: var(--primary); width: 24px; }
        .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 40px 20px; flex: 1; }
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: clamp(32px, 5vw, 64px); margin: 0; line-height: 1.1; }
        .hero span { color: var(--primary); }
        
        .shortener-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px var(--shadow); display: flex; flex-direction: column; gap: 15px; }
        
        .input-row { display: flex; gap: 10px; }
        .input-group { flex: 1; position: relative; background: var(--input-bg); border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; }
        .input-group .lucide { margin-left: 15px; color: var(--text-muted); width: 20px; }
        input, select { background: transparent; border: none; color: var(--text); font-size: 15px; padding: 15px; width: 100%; font-family: inherit; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .option-item { background: var(--input-bg); border-radius: 12px; border: 1px solid var(--border); padding: 5px 15px; display: flex; align-items: center; gap: 10px; }
        .option-item .lucide { width: 16px; color: var(--text-muted); }
        .option-item input, .option-item select { padding: 10px 0; font-size: 14px; }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font-size: 16px; transition: 0.2s; }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* History */
        .history-section { margin-top: 50px; }
        .history-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .history-item:hover { border-color: var(--primary); }
        .link-info { display: flex; flex-direction: column; gap: 4px; }
        .link-original { font-size: 13px; color: var(--text-muted); max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .link-short { font-family: var(--font-mono); color: var(--primary); font-weight: 700; text-decoration: none; }
        .meta-badges { display: flex; gap: 5px; margin-top: 5px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--input-bg); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .history-actions { display: flex; gap: 8px; }
        .btn-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .btn-icon:hover { background: var(--bg); color: var(--primary); }

        /* Modal */
        #resultModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        #resultModal.show { display: flex; }
        .modal-card { background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        
        @media (max-width: 700px) {
            .options-grid { grid-template-columns: 1fr; }
            .input-row { flex-direction: column; }
        }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface); color: var(--text); padding: 12px 24px; border: 1px solid var(--border); border-radius: 50px; font-weight: 600; opacity: 0; transition: 0.4s; z-index: 3000; box-shadow: 0 10px 30px var(--shadow); }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<header>
    <a href="/" class="brand"><i data-lucide="zap"></i> Zig<span>Link</span></a>
    <div style="display:flex; gap:10px; align-items:center;">
        <span id="domainDisplay" style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono);"></span>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><i data-lucide="moon"></i></button>
    </div>
</header>

<div class="container">
    <div class="hero">
        <h1>Shorten. <span>Secure.</span> Track.</h1>
        <p>Advanced URL management with password protection & analytics.</p>
    </div>

    <div class="shortener-card">
        <!-- Main Input -->
        <div class="input-group">
            <i data-lucide="link"></i>
            <input type="url" id="urlInput" placeholder="Paste your long URL here..." required>
        </div>

        <!-- Options Row -->
        <div class="options-grid">
            <div class="option-item">
                <i data-lucide="tag"></i>
                <input type="text" id="aliasInput" placeholder="Alias (opt)">
            </div>
            <div class="option-item">
                <i data-lucide="lock"></i>
                <input type="text" id="passInput" placeholder="Password (opt)">
            </div>
            <div class="option-item">
                <i data-lucide="clock"></i>
                <select id="ttlInput">
                    <option value="0">Never Expire</option>
                    <option value="10">10 Minutes</option>
                    <option value="60">1 Hour</option>
                    <option value="1440">24 Hours</option>
                    <option value="10080">7 Days</option>
                </select>
            </div>
        </div>

        <button class="btn-submit" onclick="createLink()" id="btnCreate">
            Shorten URL <i data-lucide="arrow-right"></i>
        </button>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span>Recent History</span>
            <button onclick="clearHistory()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;">Clear All</button>
        </div>
        <div id="historyList" class="history-list">
            <div style="text-align:center; color:var(--text-muted); padding:20px;">No history yet.</div>
        </div>
    </div>
</div>

<!-- Result Modal -->
<div id="resultModal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Link Created!</h3>
        <div id="qrcode" style="margin:20px auto; display:inline-block; padding:10px; background:white; border-radius:10px;"></div>
        <div style="background:var(--input-bg); padding:10px; border-radius:8px; word-break:break-all; font-family:var(--font-mono); margin-bottom:20px; color:var(--primary);" id="resultUrl">...</div>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn-submit" onclick="copyResult()" style="width:auto; padding:10px 30px;">Copy</button>
            <button class="btn-icon" onclick="closeModal()"><i data-lucide="x"></i></button>
        </div>
    </div>
</div>

<div id="toast">Success</div>

<script>
    lucide.createIcons();
    const API_URL = window.location.origin;
    document.getElementById('domainDisplay').innerText = window.location.host;

    // --- Theme Logic ---
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    function toggleTheme() {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }
    function updateThemeIcon(t) {
        document.getElementById('themeToggle').innerHTML = `<i data-lucide="${t==='dark'?'moon':'sun'}"></i>`;
        lucide.createIcons();
    }

    // --- Core Logic ---
    async function createLink() {
        const url = document.getElementById('urlInput').value.trim();
        const alias = document.getElementById('aliasInput').value.trim();
        const password = document.getElementById('passInput').value.trim();
        const ttl = document.getElementById('ttlInput').value;

        if(!url) return showToast("Please enter a URL", "error");

        const btn = document.getElementById('btnCreate');
        const originalText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Processing...';
        lucide.createIcons();

        try {
            const res = await fetch(API_URL + '/api/shorten', {
                method: 'POST',
                body: JSON.stringify({ url, alias, password, ttl })
            });
            const d = await res.json();

            if(res.ok) {
                const fullUrl = `${API_URL}/${d.short_code}`;
                
                saveToHistory({
                    code: d.short_code,
                    original: url,
                    short: fullUrl,
                    password: !!password,
                    expiry: ttl > 0 ? Date.now() + (ttl*60*1000) : null,
                    created: Date.now()
                });

                document.getElementById('resultUrl').innerText = fullUrl;
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), { text: fullUrl, width: 128, height: 128 });
                document.getElementById('resultModal').classList.add('show');
                
                document.getElementById('urlInput').value = '';
                document.getElementById('aliasInput').value = '';
                document.getElementById('passInput').value = '';
            } else {
                showToast(d.error || "Failed", "error");
            }
        } catch(e) { showToast("Connection Error", "error"); }

        btn.disabled = false; btn.innerHTML = originalText;
        lucide.createIcons();
    }

    // --- History Logic ---
    function saveToHistory(item) {
        const history = JSON.parse(localStorage.getItem('zig_history') || '[]');
        history.unshift(item);
        if(history.length > 15) history.pop();
        localStorage.setItem('zig_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('zig_history') || '[]');
        
        if(history.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">No history yet.</div>';
            return;
        }

        list.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="link-info">
                    <a href="${item.short}" target="_blank" class="link-short">${item.short.replace('https://','').replace('http://','')}</a>
                    <span class="link-original">${item.original}</span>
                    <div class="meta-badges">
                        ${item.password ? '<span class="badge"><i data-lucide="lock" style="width:10px"></i> Protected</span>' : ''}
                        ${item.expiry ? `<span class="badge"><i data-lucide="clock" style="width:10px"></i> Exp: ${new Date(item.expiry).toLocaleTimeString()}</span>` : ''}
                        <span class="badge" id="clicks-${item.code}">Loading...</span>
                    </div>
                </div>
                <div class="history-actions">
                    <button class="btn-icon" onclick="fetchStats('${item.code}')" title="Stats"><i data-lucide="bar-chart-2"></i></button>
                    <button class="btn-icon" onclick="copyToClip('${item.short}')" title="Copy"><i data-lucide="copy"></i></button>
                    <button class="btn-icon" onclick="deleteHistoryItem(${item.created})" title="Delete" style="color:#ef4444; border-color:rgba(239,68,68,0.2)"><i data-lucide="trash-2"></i></button>
                </div>
            </div>
        `).join('');
        lucide.createIcons();
        history.forEach(item => fetchStats(item.code));
    }

    function deleteHistoryItem(ts) {
        let history = JSON.parse(localStorage.getItem('zig_history') || '[]');
        history = history.filter(i => i.created !== ts);
        localStorage.setItem('zig_history', JSON.stringify(history));
        renderHistory();
        showToast("Deleted from history");
    }

    async function fetchStats(code) {
        try {
            const res = await fetch(`/api/stats/${code}`);
            if(res.ok) {
                const d = await res.json();
                const el = document.getElementById(`clicks-${code}`);
                if(el) el.innerHTML = `<i data-lucide="mouse-pointer-2" style="width:10px"></i> ${d.clicks} clicks`;
                lucide.createIcons();
            }
        } catch(e) {}
    }

    function clearHistory() {
        if(confirm("Clear all history?")) {
            localStorage.removeItem('zig_history');
            renderHistory();
        }
    }

    // --- Helpers ---
    function showToast(msg, type="success") {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.className = "show";
        t.style.borderColor = type === 'error' ? 'red' : 'var(--border)';
        setTimeout(() => t.className = "", 2000);
    }
    
    function closeModal() { document.getElementById('resultModal').classList.remove('show'); }
    function copyResult() { copyToClip(document.getElementById('resultUrl').innerText); }
    function copyToClip(text) { navigator.clipboard.writeText(text); showToast("Copied!"); }

    renderHistory();
</script>

</body>
</html>
